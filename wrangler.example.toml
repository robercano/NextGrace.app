# Solo para desarrollo local (`cp wrangler.example.toml wrangler.toml`; wrangler.toml está en .gitignore).
# En producción los bindings se configuran en el panel de Pages (D1 "DB" y la variable ADMIN_STEAMIDS);
# no subas un wrangler.toml al repo o Pages intentará usarlo en el deploy.
name = "tarnishedviewer"
pages_build_output_dir = "."
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "tarnished-ledger"
database_id = "local"

[vars]
ADMIN_STEAMIDS = "REPLACE_WITH_YOUR_STEAMID64"
