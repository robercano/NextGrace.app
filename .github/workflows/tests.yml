# API test suite against a local Worker (wrangler 4 + local D1/R2): tests/run.sh. The browser tests need a real save, so they
# only run locally (TEST_SAVE=…).
name: tests
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install wrangler
        run: npm install --no-save wrangler@4
      - name: Run
        env: { WRANGLER: ./node_modules/.bin/wrangler }
        run: tests/run.sh
      - name: Worker log on failure
        if: failure()
        run: tail -100 tests/.state/wrangler.log || true
