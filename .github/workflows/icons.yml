# Descarga el pack de iconos desde eldenring.wiki.gg y lo guarda en icons/ (commit directo a main).
# Solo se ejecuta si el repo es PRIVADO: los iconos son arte de FromSoftware y no deben publicarse.
name: icons
on:
  workflow_dispatch:
    inputs:
      kinds:
        description: "Grupos a descargar (vacío = todos; p. ej. 'weapon Armor talisman')"
        default: ""
      limit:
        description: "Solo los N primeros (prueba rápida); vacío = todos"
        default: ""
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Comprobar que el repo es privado
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error::El repo es público. Ponlo en privado antes de guardar iconos en él."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Descargar iconos
        run: python tools/fetch_icons.py --kinds ${{ github.event.inputs.kinds }} --limit ${{ github.event.inputs.limit || 0 }}
      - name: Regenerar índice
        run: python tools/icons_index.py
      - name: Commit
        run: |
          git config user.name "icons-bot"
          git config user.email "actions@users.noreply.github.com"
          git add icons
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "icons: actualizar pack desde la wiki"
          # main puede haber avanzado durante la descarga: rebase y reintento
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep 10
          done
          exit 1
