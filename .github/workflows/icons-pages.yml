# Segunda pasada de iconos: lee el `image=` del infobox de cada objeto sin icono y descarga ese fichero.
# Arte del juego: solo con el repo en privado.
name: icons-pages
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Solo informe (true) o descarga (false)"
        default: "false"
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Comprobar que el repo es privado
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error::El repo es público. Ponlo en privado antes."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Descargar iconos por página
        run: |
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then python tools/fetch_icons_pages.py --dry | tee tools/icons_pages_log.txt; else python tools/fetch_icons_pages.py; fi
      - run: python tools/icons_index.py
      - name: Commit
        run: |
          git config user.name "icons-bot"
          git config user.email "actions@users.noreply.github.com"
          git add icons tools/icons_pages_log.txt
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "icons: segunda pasada por páginas de la wiki"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep 10
          done
          exit 1
