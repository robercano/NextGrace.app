# Downloads the interactive maps (DataMaps) of eldenring.wiki.gg: markers to data/map.json. The backgrounds the
# script writes to icons/map/ are game art: they are NOT committed (gitignored); upload them to the assets repo instead.
name: map
on:
  workflow_dispatch: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Descargar mapas
        run: python tools/fetch_map.py
      - name: Commit
        run: |
          git config user.name "map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/map.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "map: actualizar marcadores y fondos desde la wiki"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep 10
          done
          exit 1
