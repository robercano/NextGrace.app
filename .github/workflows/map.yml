# Descarga los mapas interactivos (DataMaps) de eldenring.wiki.gg: marcadores a data/map.json
# y fondos a icons/map/. Las imágenes son arte del juego: solo con el repo en privado.
name: map
on:
  workflow_dispatch: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Comprobar que el repo es privado
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error::El repo es público. Ponlo en privado antes."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Descargar mapas
        run: python tools/fetch_map.py
      - name: Commit
        run: |
          git config user.name "map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/map.json icons/map
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "map: actualizar marcadores y fondos desde la wiki"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep 10
          done
          exit 1
