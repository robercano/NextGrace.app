<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a0a">
<title>Tarnished Ledger · Mapa</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{--bg:#0b0a0a;--panel:#121110;--panel-2:#1c1a18;--line:#3a352c;--fg:#dcd3bf;--muted:#7d7563;--accent:#c9a44a;--accent-fg:#1a1508;--ok:#7fb069;--bad:#c85a4a;--user:#5e8fd6;
  --display:"Cinzel",Georgia,serif;--body:"EB Garamond",Georgia,serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.bar{display:flex;gap:8px;align-items:center;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h1{font-family:var(--display);font-size:1rem;margin:0;flex:1;white-space:nowrap;color:var(--accent)}
.modes{display:flex;justify-content:center;padding:6px 12px 0;background:var(--panel);border-bottom:1px solid var(--line)}
.mode{font-family:var(--display);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 18px;border:1px solid var(--line);border-bottom:0}
.mode:first-child{border-radius:3px 0 0 0}.mode:last-child{border-radius:0 3px 0 0;border-left:0}
.mode[aria-current=true]{color:var(--accent);background:#d6a93d14;border-color:#8c7332}
.btn,select,input{font:inherit;color:inherit;background:var(--panel-2);border:1px solid var(--line);border-radius:0;padding:6px 10px}
.btn{font-family:var(--display);font-size:.78rem;letter-spacing:.06em}
.btn{cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#map{flex:1;min-height:0;background:#0f0e12}
.tools.sub{padding-top:4px;gap:4px;background:#0f0e0d;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.tools.sub::-webkit-scrollbar{display:none}
.tools.sub .chip{flex:none;white-space:nowrap}
.tools.sub .chip{font-size:.62rem;padding:3px 8px;display:inline-flex;align-items:center;gap:4px;text-transform:none;letter-spacing:.04em;font-family:var(--body);font-size:.85rem}
.tools.sub .chip svg{opacity:.9}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:0;padding:4px 10px;font-family:var(--display);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--fg)}
.chip[aria-pressed=true]{background:#c9a44a14;color:var(--accent);border-color:var(--accent);font-weight:600}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
#q{flex:1;min-width:140px}
.leaflet-container{font-family:var(--body)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#121110;color:var(--fg);box-shadow:0 4px 18px #000a;border:1px solid var(--line);border-radius:0}
.leaflet-popup-content{margin:10px 12px;font-size:14px;line-height:1.35;max-height:50vh;overflow:auto}
.leaflet-popup-content a{color:var(--accent)}
.leaflet-control-zoom a{background:var(--panel);color:var(--fg);border-color:var(--line)}
.pin{border-radius:50%;border:1.5px solid #000c;box-shadow:0 0 0 1px #fff4;display:flex;align-items:center;justify-content:center;color:#fff;position:relative}
.pin b{position:absolute;right:-5px;top:-6px;background:#000;color:#fff;font-size:10px;line-height:1;padding:2px 4px;border-radius:8px;border:1px solid #fff6;font-weight:700}
.pin.grace{background:#3f7a3b;color:#cfe8c9}.pin.grace.todo{background:var(--accent);color:#1a1508;box-shadow:0 0 0 1px #fff6,0 0 8px #d6a93d88}
.pin.place{background:#5c574d;color:#e8e2d3;opacity:.9}
.pin.place.seen{background:#2f5a3b;color:#cfe8c9}
.pin.place.todo{background:#8a6d1f;color:#fff}
.pin.miss{background:#b8322a;color:#fff;box-shadow:0 0 0 1px #fff6,0 0 8px #b8322a88;border-radius:6px}
.pin.user{background:var(--user);color:#fff}.pin.user.todo{opacity:.75;outline:1px dashed #fff8}
.pin.boss{background:#4d4259;color:#c9bfd6;border-radius:4px}.pin.boss.todo{background:#e0294f;color:#fff;box-shadow:0 0 0 1px #fff6,0 0 10px #e0294f99;border-radius:4px}
.popup h4{margin:0 0 4px;font-family:var(--display);font-size:.95rem}
.popup .m{color:var(--muted);font-size:.85rem}
.popup ul{margin:6px 0 0;padding-left:18px}
.popup li.have{color:var(--muted);text-decoration:line-through}
.sheet{position:fixed;inset:auto 0 0 0;background:#121110;border-top:1px solid var(--accent);padding:12px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:1000;display:flex;flex-direction:column;gap:8px;box-shadow:0 -6px 24px #000a;max-height:70vh;overflow:auto}
.sheet h3{margin:0;font-family:var(--display);font-size:1rem}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet input,.sheet select{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:.85rem}
.hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:900;background:var(--accent);color:var(--accent-fg);padding:6px 12px;border-radius:0;font-family:var(--display);font-size:.75rem;letter-spacing:.08em;font-weight:700;box-shadow:0 2px 10px #0008}
.legend{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:800;background:#0b0a0ad9;border:1px solid var(--line);border-radius:0;padding:6px 10px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.legend .pin{box-shadow:none}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
</style>
</head>
<body>
<div class="bar">
  <h1>Tarnished Ledger</h1>
  <select id="charSel" aria-label="Personaje" hidden></select>
  <select id="layerSel" aria-label="Capa">
    <option value="tlb" data-i18n="Tierras Intermedias">Tierras Intermedias</option>
    <option value="gugr" data-i18n="Subsuelo">Subsuelo</option>
    <option value="sote" data-i18n="Reino de las Sombras">Reino de las Sombras</option>
  </select>
  <select id="stateSel" aria-label="Estado">
    <option value="all" data-i18n="Todo">Todo</option>
    <option value="todo" data-i18n="Pendiente">Pendiente</option>
    <option value="done" data-i18n="Hecho">Hecho</option>
  </select>
  <button class="btn" data-lang-toggle style="margin-left:auto;padding:5px 8px;font-size:.7rem;letter-spacing:.1em">EN</button>
</div>
<div class="modes"><a class="mode" href="./" data-i18n="Ficha">Ficha</a><a class="mode" aria-current="true" href="map.html" data-i18n="Mapa">Mapa</a></div>
<div class="tools">
  <input id="q" type="search" placeholder="Buscar lugar, gracia u objeto…" data-i18n-ph="Buscar lugar, gracia u objeto…" autocomplete="off">
  <button class="chip" data-l="grace" aria-pressed="true"><i style="background:var(--ok)"></i><span data-i18n="Gracias">Gracias</span></button>
  <button class="chip" data-l="boss" aria-pressed="true"><i style="background:#ff3b6b"></i><span data-i18n="Jefes">Jefes</span></button>
  <button class="chip" data-l="place" aria-pressed="false"><i style="background:#8a8577"></i><span data-i18n="Lugares">Lugares</span></button>
  <button class="chip" data-l="miss" aria-pressed="true"><i style="background:var(--bad)"></i><span data-i18n="Me faltan">Me faltan</span></button>
  <button class="chip" data-l="user" aria-pressed="true"><i style="background:var(--user)"></i><span data-i18n="Añadidos">Añadidos</span></button>
  <button class="btn" id="addBtn" data-i18n="+ Añadir">+ Añadir</button>
</div>
<div class="tools sub" id="placeTypes" hidden></div>
<div class="wrap">
  <div id="map"></div>
  <div class="hint" id="hint" hidden data-i18n="Toca el mapa donde está el objeto.">Toca el mapa donde está el objeto</div>
  <div class="legend" id="legend"></div>
</div>

<div class="sheet" id="sheet" hidden>
  <h3 data-i18n="Nuevo marcador">Nuevo marcador</h3>
  <div class="row"><input id="mItem" list="items" placeholder="Objeto (empieza a escribir)" data-i18n-ph="Objeto (empieza a escribir)" autocomplete="off"><datalist id="items"></datalist></div>
  <div class="row"><input id="mNote" placeholder="Nota (opcional): cofre, enemigo, cómo llegar…" data-i18n-ph="Nota (opcional): cofre, enemigo, cómo llegar…"></div>
  <label class="row small" id="mPendRow" hidden style="align-items:center;gap:6px"><input type="checkbox" id="mPend" style="flex:0 0 auto"> <span data-i18n="Enviar como propuesta pendiente (para probar la moderación)">Enviar como propuesta pendiente (para probar la moderación)</span></label>
  <div class="row"><button class="btn primary" id="mSave" data-i18n="Guardar">Guardar</button><button class="btn" id="mCancel" data-i18n="Cancelar">Cancelar</button></div>
  <p class="muted small" style="margin:0" id="sheetNote" data-i18n="Se guarda en este navegador. Desde <b>Añadidos → Exportar</b> puedes copiar el JSON y enviarlo al repo para compartirlo.">Se guarda en este navegador. Desde <b>Añadidos → Exportar</b> puedes copiar el JSON y enviarlo al repo para compartirlo.</p>
</div>

<div class="sheet" id="userSheet" hidden>
  <h3 data-i18n="Marcadores añadidos">Marcadores añadidos</h3>
  <div id="userList" class="small"></div>
  <div class="row"><button class="btn" id="exportBtn" data-i18n="Copiar JSON">Copiar JSON</button><label class="btn" for="importFile" data-i18n="Importar JSON">Importar JSON</label><input id="importFile" type="file" accept=".json,application/json" hidden><button class="btn" id="userClose" data-i18n="Cerrar">Cerrar</button></div>
  <p class="muted small" style="margin:0" id="exportMsg"></p>
  <p class="muted small" style="margin:6px 0 0"><a href="about.html" data-i18n="Créditos y licencias">Créditos y licencias</a> · <a href="privacy.html" data-i18n="Política de privacidad">Política de privacidad</a></p>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="src/i18n.js"></script>
<script src="src/marks.js"></script>
<script src="src/cloud.js"></script>
<script>
(async function () {
  const $ = s => document.querySelector(s);
  I18N.apply();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const WIKI = "https://eldenring.wiki.gg/wiki/";
  const wl = (name, text) => `<a href="${WIKI}${encodeURIComponent(name.replace(/ /g, "_"))}" target="_blank" rel="noopener">${text || esc(name)}</a>`;
  const W = 9645, H = 9119;

  const [DB, P, F, MAPMETA] = await Promise.all(["data/items.json", "data/places.json", "data/flags.json", "data/map.json"].map(u => fetch(u).then(r => r.json())));
  let community = []; try { community = await fetch("data/user_markers.json").then(r => r.ok ? r.json() : []); } catch (e) {}
  await Cloud.init();

  // ---- save data (written by index page) ---------------------------------
  let last = null; try { last = JSON.parse(localStorage.getItem("tl.last") || "null"); } catch (e) {}
  const chars = (last && last.chars || []).filter(c => !c.error);
  const sel = $("#charSel");
  if (chars.length) { sel.innerHTML = chars.map((c, i) => `<option value="${i}">${esc(c.name)} · ${c.level}</option>`).join(""); sel.hidden = chars.length < 2; }
  let curSlot = null; try { curSlot = localStorage.getItem("tl.cur"); } catch (e) {}
  let CUR = chars.find(c => String(c.slot) === curSlot) || chars[0] || null;
  if (CUR) sel.value = String(chars.indexOf(CUR));
  // account: community markers from the database + marks sync (both optional)
  if (Cloud.available()) { try { const cm = await Cloud.markers(); community = community.concat(cm.map(m => ({ x: m.x, y: m.y, layer: m.layer, item: m.item, note: m.note, by: m.by, status: m.status, id: m.id, remote: true }))); } catch (e) {} }
  async function syncMarks() { if (!Cloud.user() || !CUR) return; const ck = Marks.charKey(CUR), n = Marks.all(ck).length; const r = await Cloud.syncMarks(ck); if (r && !r.error && Marks.all(ck).length !== n) render(); }

  const baseKey = i => { let n = i.name || ""; if (i.kind === "weapon" && i.infusion && i.infusion !== "Standard" && n.startsWith(i.infusion + " ")) n = n.slice(i.infusion.length + 1); if (i.kind !== "talisman") n = n.replace(/\s*\+\d+$/, ""); return n.toLowerCase(); };
  const CATS = new Set(["melee_armaments", "ranged_and_catalysts", "shields", "head", "chest", "arms", "legs", "talismans", "ashes_of_war", "ashes", "sorceries", "incantations", "key_items"]);
  const CATALOG = Object.entries(DB.items).filter(([id, e]) => !e.f && CATS.has(e.c) && !(e.k === "weapon" && (+id) % 10000) && !(e.c === "ashes" && /\s\+\d+$/.test(e.n))).map(([id, e]) => ({ id: +id, name: e.n, kind: e.k, cat: e.c, loc: e.loc || "" }));
  const haveSet = c => new Set((c.all || []).map(baseKey));

  // ---- map -----------------------------------------------------------------
  const map = L.map("map", { crs: L.CRS.Simple, minZoom: -4, maxZoom: 2, zoomSnap: 0.25, attributionControl: true });
  map.attributionControl.setPrefix("").addAttribution('Lugares: <a href="https://eldenring.wiki.gg" target="_blank" rel="noopener">eldenring.wiki.gg</a> (CC BY-NC-SA)');
  const bounds = [[0, 0], [H, W]];
  const bgs = { tlb: "icons/map/tlb.webp", gugr: "icons/map/gugr.webp", sote: "icons/map/sote.webp" };
  let bgLayer = null;
  function setBg(k) { if (bgLayer) map.removeLayer(bgLayer); bgLayer = L.imageOverlay(bgs[k], bounds).addTo(map); }
  setBg("tlb"); map.fitBounds(bounds);
  $("#layerSel").onchange = e => { setBg(e.target.value); render(); };
  const layers = { grace: L.layerGroup().addTo(map), boss: L.layerGroup().addTo(map), place: L.layerGroup(), miss: L.layerGroup().addTo(map), user: L.layerGroup().addTo(map) };
  const vis = { grace: true, boss: true, place: false, miss: true, user: true };
  // filters from the URL hash (set by the progress tab): l=grace,boss,... s=todo|done|all t=main|field|rem q=text
  let state = "all", bossType = null, hashQ = "";
  (function fromHash() {
    const h = new URLSearchParams(location.hash.slice(1)); if (!h.has("l") && !h.has("s") && !h.has("t") && !h.has("q")) return;
    if (h.get("l")) { const on = new Set(h.get("l").split(",")); for (const k in vis) vis[k] = on.has(k); }
    if (/^(todo|done|all)$/.test(h.get("s") || "")) state = h.get("s");
    if (/^(main|field|rem)$/.test(h.get("t") || "")) bossType = h.get("t");
    if (h.get("q")) hashQ = h.get("q").toLowerCase();
  })();
  // Own glyphs (16x16). Keys = marker kinds.
  const G = {
    grace: '<circle cx="8" cy="8" r="3"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3"/>',
    boss: '<path d="M4 7a4 4 0 0 1 8 0v3h-1v2H5v-2H4z"/><circle cx="6.3" cy="7.5" r="1" fill="currentColor"/><circle cx="9.7" cy="7.5" r="1" fill="currentColor"/>',
    church: '<path d="M8 1v4M6 3h4M3 15V8l5-4 5 4v7z"/>', ruins: '<path d="M2 14h12M3 14V7h2v7M7 14V5h2v9M11 14V9h2v5"/>', cave: '<path d="M2 14c0-6 3-9 6-9s6 3 6 9zM6 14v-4h4v4"/>',
    catacombs: '<path d="M3 15V6a5 5 0 0 1 10 0v9zM8 8v7M5 10h6"/>', tunnel: '<path d="M2 15V9a6 6 0 0 1 12 0v6M5 15V9a3 3 0 0 1 6 0v6"/>', dungeon: '<path d="M2 15V5h3V3h2v2h2V3h2v2h3v10zM6 15v-4h4v4"/>',
    fort: '<path d="M2 15V5h2V3h2v2h4V3h2v2h2v10zM7 15v-4h2v4"/>', tower: '<path d="M5 15V4l3-2 3 2v11zM6 6h4M6 9h4"/>', evergaol: '<circle cx="8" cy="8" r="6"/><path d="M8 2v12M2 8h12"/>',
    tree: '<path d="M8 15V9M3 9l5-7 5 7z"/>', stream: '<path d="M4 2c4 3-4 5 0 8s-4 5 0 6M10 2c4 3-4 5 0 8s-4 5 0 6"/>', mausoleum: '<path d="M3 15V7l5-4 5 4v8zM6 15v-5h4v5"/>',
    well: '<path d="M3 7h10M4 7v8h8V7M8 3v4M6 3h4"/>', village: '<path d="M1 15V9l3-3 3 3v6M9 15V8l3-3 3 3v7"/>', golem: '<path d="M5 15V8l3-5 3 5v7M6 10h4"/>', pot: '<path d="M5 15h6l1-7H4zM6 8V5h4v3"/>',
    region: '<circle cx="8" cy="8" r="2" fill="currentColor"/>', place: '<circle cx="8" cy="8" r="3"/>',
    weapon: '<path d="M3 13l8-8M9 3l4 4M3 13l-1 1M5 11l-2 2"/>', armor: '<path d="M4 3h8l1 4-2 7H5L3 7z"/>', talisman: '<circle cx="8" cy="9" r="4"/><path d="M8 2v3"/>', aow: '<path d="M8 2l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z"/>', spell: '<path d="M8 2l1.5 4.5L14 8l-4.5 1.5L8 14l-1.5-4.5L2 8l4.5-1.5z"/>', key: '<circle cx="5" cy="8" r="3"/><path d="M8 8h6M12 8v3M14 8v2"/>', item: '<path d="M3 5h10v9H3zM3 5l2-3h6l2 3M8 2v3"/>',
    user: '<path d="M8 15s-5-4-5-8a5 5 0 0 1 10 0c0 4-5 8-5 8z"/><circle cx="8" cy="7" r="2"/>',
  };
  const GROUP_KIND = { SiteofGrace: "grace", SiteOfGrace: "grace", Church: "church", Ruins: "ruins", UndergroundRuins: "ruins", Cave: "cave", Catacombs: "catacombs", "Hero'sGrave": "catacombs", Tunnels: "tunnel", TunnelEntrance: "tunnel", LegacyDungeon: "dungeon", OldCastle: "dungeon", Fort: "fort", Rise: "tower", LookoutTower: "tower", DivineTower: "tower", Evergaol: "evergaol", MinorErdtree: "tree", Spiritstream: "stream", RebirthMonument: "mausoleum", RiverWell: "well", Village: "village", Town: "village", SunkenTown: "village", EternalCity: "village", FurnaceGolem: "golem", PotThrowingLocation: "pot", Shack: "village", Windmill: "village", Colosseum: "evergaol", GrandLift: "tower", Gateway: "tower", SubRegion: "region", Map: "item" };
  const CAT_KIND = { melee_armaments: "weapon", ranged_and_catalysts: "weapon", shields: "weapon", head: "armor", chest: "armor", arms: "armor", legs: "armor", talismans: "talisman", ashes_of_war: "aow", ashes: "aow", sorceries: "spell", incantations: "spell", key_items: "key" };
  const KIND_ES0 = { grace: "Gracias", church: "Iglesias", ruins: "Ruinas", cave: "Cuevas", catacombs: "Catacumbas", tunnel: "Túneles", dungeon: "Mazmorras", fort: "Fuertes", tower: "Torres", evergaol: "Evergaols", tree: "Árboles menores", stream: "Corrientes", mausoleum: "Mausoleos", well: "Pozos", village: "Aldeas", golem: "Gólems", pot: "Ollas", region: "Regiones", place: "Otros", item: "Mapas" };
  const KIND_EN = { grace: "Graces", church: "Churches", ruins: "Ruins", cave: "Caves", catacombs: "Catacombs", tunnel: "Tunnels", dungeon: "Dungeons", fort: "Forts", tower: "Towers", evergaol: "Evergaols", tree: "Minor Erdtrees", stream: "Rivers", mausoleum: "Mausoleums", well: "Wells", village: "Villages", golem: "Golems", pot: "Pots", region: "Regions", place: "Other", item: "Maps" };
  const KIND_ES = I18N.lang === "en" ? KIND_EN : KIND_ES0;
  let placeKinds = null; // null = all
  const glyph = (k, size) => `<svg viewBox="0 0 16 16" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">${G[k] || G.place}</svg>`;
  const pin = (cls, kind, label) => { const big = cls.includes("miss") || cls.includes("todo"); const s = big ? 26 : 18;
    return L.divIcon({ className: "", html: `<div class="pin ${cls}" style="width:${s}px;height:${s}px">${glyph(kind, big ? 16 : 11)}${label ? `<b>${label}</b>` : ""}</div>`, iconSize: [s, s], iconAnchor: [s / 2, s / 2] }); };
  const at = (p) => [p.y, p.x];

  // place lookups
  const placeByName = new Map(P.places.map(p => [p.name.toLowerCase(), p]));
  const norm = s => s.toLowerCase().replace(/\s*\(.*\)\s*$/, "");
  const findPlace = name => placeByName.get(name.toLowerCase()) || placeByName.get(norm(name)) || null;
  const layerOf = p => (p.layer || "").includes("GUGR") ? "gugr" : (p.layer || "").includes("SOTE") ? "sote" : "tlb";

  // user markers
  let userMarkers = []; try { userMarkers = JSON.parse(localStorage.getItem("tl.markers") || "[]"); } catch (e) {}
  const saveUser = () => { try { localStorage.setItem("tl.markers", JSON.stringify(userMarkers)); } catch (e) {} };

  let q = hashQ;
  function render() {
    for (const k in layers) layers[k].clearLayers();
    const layer = $("#layerSel").value;
    const have = CUR ? haveSet(CUR) : null;
    const gv = new Set(CUR && CUR.progress ? CUR.progress.graces : []), bd = new Set(CUR && CUR.progress ? CUR.progress.bosses : []);
    const picked = new Set(CUR && CUR.progress ? CUR.progress.picked || [] : []), haveIds = new Set(CUR ? (CUR.all || []).map(i => i.id) : []);
    // "visited" evidence per place name: any grace touched or boss beaten whose place is this one
    const seen = new Set(), known = new Set();
    const CK = CUR ? Marks.charKey(CUR) : null, manual = CK ? Marks.load(CK) : new Set();
    for (const g of F.graces) { const p = findPlace(g.name); if (!p) continue; known.add(p.name.toLowerCase()); if (gv.has(g.id)) seen.add(p.name.toLowerCase()); }
    for (const b of F.bosses) { const p = findPlace(b.region); if (!p) continue; known.add(p.name.toLowerCase()); if (bd.has(b.id)) seen.add(p.name.toLowerCase()); }
    const match = s => !q || s.toLowerCase().includes(q);

    // graces: from flags DB, placed by wiki place of same name
    const graceNames = new Set();
    for (const g of F.graces) { const p = findPlace(g.name); if (!p || layerOf(p) !== layer) continue; graceNames.add(p.name.toLowerCase()); if (!match(g.name)) continue;
      const done = gv.has(g.id) || manual.has("grace:" + g.id); if (state !== "all" && (state === "done") !== done) continue;
      L.marker(at(p), { icon: pin("grace" + (done ? "" : " todo"), "grace") }).bindPopup(`<div class="popup"><h4>${wl(g.name)}</h4><div class="m">${T("Gracia")} · ${esc(g.region)} · ${done ? T("visitada") : T("pendiente")}</div></div>`).addTo(layers.grace); }
    // bosses: placed by region/place name
    for (const b of F.bosses) { if (bossType === "main" && b.type !== "main") continue; if (bossType === "field" && b.type === "main") continue; if (bossType === "rem" && !b.rem) continue;
      const p = findPlace(b.region) || findPlace(b.name); if (!p || layerOf(p) !== layer || !match(b.name)) continue; const done = bd.has(b.id) || manual.has("boss:" + b.id); if (state !== "all" && (state === "done") !== done) continue;
      L.marker(at(p), { icon: pin("boss" + (done ? "" : " todo"), "boss") }).bindPopup(`<div class="popup"><h4>${wl(b.name)}</h4><div class="m">${T("Jefe")} · ${esc(b.region)} · ${done ? T("vencido") : T("pendiente")}${b.rem ? " · " + T("remembranza") : ""}</div></div>`).addTo(layers.boss); }
    // places
    for (const p of P.places) { if (p.region || layerOf(p) !== layer || graceNames.has(p.name.toLowerCase()) || !match(p.name)) continue; const pk = GROUP_KIND[p.group] || "place"; if (placeKinds && !placeKinds.has(pk)) continue;
      const k = p.name.toLowerCase(), man = manual.has("place:" + p.id), st = seen.has(k) || man ? "seen" : known.has(k) && CUR ? "todo" : "";
      if (state === "done" && st !== "seen") continue; if (state === "todo" && st === "seen") continue;
      L.marker(at(p), { icon: pin("place " + st, GROUP_KIND[p.group] || "place") }).bindPopup(`<div class="popup"><h4>${wl(p.article || p.name, esc(p.name))}</h4><div class="m">${esc(KIND_ES[GROUP_KIND[p.group]] || p.group)}${seen.has(k) ? " · " + T("visitado (según el save)") : man ? " · " + T("visitado (marcado a mano)") : st === "todo" ? " · " + T("pendiente") : ""}</div>${CUR ? `<button class="chip" data-mark="place|${p.id}" aria-pressed="${man}" style="margin-top:6px">${man ? T("✓ Visitado") : T("Marcar como visitado")}</button>` : ""}</div>`).addTo(layers.place); }
    // missing items grouped by place
    if (have) {
      const byPlace = new Map();
      for (const it of CATALOG) { if (have.has(baseKey({ name: it.name, kind: it.kind })) || picked.has(it.id) || manual.has("item:" + it.id)) continue; const pls = P.items[it.id]; if (!pls) continue;
        for (const pi of pls) { const p = P.places[pi]; if (p.region || layerOf(p) !== layer) continue; if (!match(it.name) && !match(p.name)) continue; (byPlace.get(pi) || byPlace.set(pi, []).get(pi)).push(it); } }
      for (const [pi, list] of byPlace) { const p = P.places[pi];
        L.marker(at(p), { icon: pin("miss", (() => { const n = {}; for (const it of list) { const k = CAT_KIND[it.cat] || "item"; n[k] = (n[k] || 0) + 1; } return Object.entries(n).sort((a, b) => b[1] - a[1])[0][0]; })(), list.length), zIndexOffset: 500 }).bindPopup(`<div class="popup"><h4>${esc(p.name)}</h4><div class="m">${T("{0} objeto{1} que te faltan", list.length, list.length > 1 ? "s" : "")}</div><ul>${list.map(it => `<li>${wl(it.name)} <button class="chip" data-mark="item|${it.id}" aria-pressed="false" style="font-size:.72rem;padding:1px 7px">${T("conseguido")}</button><div class="m">${esc(it.loc.replace(/\s*\[\s*Map Link\s*\]\s*;?/g, ""))}</div></li>`).join("")}</ul></div>`, { maxWidth: 320 }).addTo(layers.miss); }
    }
    // user + community markers
    const remoteIds = new Set(community.filter(m => m.remote).map(m => m.id));
    for (const m of community.concat(userMarkers.filter(m => !(m.remoteId && remoteIds.has(m.remoteId))))) { if ((m.layer || "tlb") !== layer || !match(m.item || "") && !match(m.note || "")) continue; const own = have ? have.has((m.item || "").toLowerCase().replace(/\s*\+\d+$/, "")) : false;
      const st = m.status === "pending" ? T(" · pendiente de revisión") : m.status === "rejected" ? T(" · rechazado") : m.remote ? "" : m.remoteId ? T(" · enviado") : T(" · solo en este navegador");
      L.marker([m.y, m.x], { icon: pin("user" + (m.status === "pending" ? " todo" : ""), "user") }).bindPopup(`<div class="popup"><h4>${m.item ? wl(m.item) : T("Marcador")}</h4><div class="m">${esc(m.note || "")}${own ? " · " + T("ya lo tienes") : ""}${m.by ? " · " + T("por {0}", esc(m.by)) : ""}${st}</div></div>`).addTo(layers.user); }
    for (const k in layers) { if (vis[k]) map.addLayer(layers[k]); else map.removeLayer(layers[k]); }
  }
  (function buildPlaceTypes() {
    const cnt = {}; for (const p of P.places) { if (p.region) continue; const k = GROUP_KIND[p.group] || "place"; cnt[k] = (cnt[k] || 0) + 1; }
    const kinds = Object.keys(cnt).filter(k => k !== "grace").sort((a, b) => cnt[b] - cnt[a]);
    const box = $("#placeTypes");
    box.innerHTML = `<button class="chip" data-pk="*" aria-pressed="true">${T("Todos")}</button>` + kinds.map(k => `<button class="chip" data-pk="${k}" aria-pressed="false">${glyph(k, 12)}${KIND_ES[k] || k} <span style="opacity:.6">${cnt[k]}</span></button>`).join("");
    box.onclick = e => { const b = e.target.closest("[data-pk]"); if (!b) return; const k = b.dataset.pk;
      if (k === "*") placeKinds = null; else { placeKinds = placeKinds || new Set(); if (placeKinds.has(k)) placeKinds.delete(k); else placeKinds.add(k); if (!placeKinds.size) placeKinds = null; }
      for (const c of box.querySelectorAll("[data-pk]")) c.setAttribute("aria-pressed", c.dataset.pk === "*" ? !placeKinds : !!(placeKinds && placeKinds.has(c.dataset.pk)));
      render(); };
  })();
  document.addEventListener("click", e => { const b = e.target.closest("[data-mark]"); if (!b || !CUR) return; const [k, id] = b.dataset.mark.split("|"); const on = Marks.toggle(Marks.charKey(CUR), k, id); if (Cloud.user()) (on ? Cloud.syncMarks(Marks.charKey(CUR)) : Cloud.removeMark(Marks.charKey(CUR), k, id)); map.closePopup(); render(); });
  for (const b of document.querySelectorAll(".chip[data-l]")) b.onclick = () => { const k = b.dataset.l; vis[k] = !vis[k]; b.setAttribute("aria-pressed", vis[k]); if (k === "user" && vis[k]) openUser(); if (k === "place") $("#placeTypes").hidden = !vis[k]; render(); };
  $("#q").oninput = e => { q = e.target.value.trim().toLowerCase(); render(); };
  sel.onchange = () => { CUR = chars[+sel.value]; try { localStorage.setItem("tl.cur", String(CUR.slot)); } catch (e) {} render(); syncMarks(); };

  // ---- editor --------------------------------------------------------------
  $("#items").innerHTML = CATALOG.map(i => `<option value="${esc(i.name)}">`).join("");
  if (Cloud.isAdmin()) $("#mPendRow").hidden = false;
  if (Cloud.user()) $("#sheetNote").innerHTML = Cloud.isAdmin() ? T("Se publica directamente en el mapa de la comunidad (eres moderador).") : T("Se envía al mapa de la comunidad y aparecerá para todos cuando un moderador lo apruebe. Mientras, lo verás solo tú.");
  else if (Cloud.available()) $("#sheetNote").innerHTML = T('Se guarda en este navegador. Si entras con Steam desde la <a href="./">ficha</a>, tus marcadores se envían al mapa de la comunidad.');
  let adding = false, pending = null;
  $("#addBtn").onclick = () => { adding = !adding; $("#hint").hidden = !adding; $("#addBtn").setAttribute("aria-pressed", adding); };
  map.on("click", e => { if (!adding) return; pending = { x: Math.round(e.latlng.lng * 10) / 10, y: Math.round(e.latlng.lat * 10) / 10, layer: $("#layerSel").value }; $("#mItem").value = ""; $("#mNote").value = ""; $("#sheet").hidden = false; $("#mItem").focus(); });
  $("#mCancel").onclick = () => { $("#sheet").hidden = true; };
  $("#mSave").onclick = () => { if (!pending) return; const item = $("#mItem").value.trim(); if (!item) { $("#mItem").focus(); return; }
    const m = Object.assign(pending, { item, note: $("#mNote").value.trim(), at: new Date().toISOString().slice(0, 10) }); userMarkers.push(m); saveUser(); $("#sheet").hidden = true; adding = false; $("#hint").hidden = true; $("#addBtn").setAttribute("aria-pressed", "false"); render();
    if (Cloud.user()) Cloud.proposeMarker({ layer: m.layer, x: m.x, y: m.y, item: m.item, note: m.note, pending: $("#mPend").checked }).then(r => { if (r && !r.error) { m.remoteId = r.id; m.status = r.status; community.push(Object.assign({}, m, { remote: true, id: r.id, by: Cloud.user().name })); saveUser(); render(); } }); };
  function openUser() { $("#userList").innerHTML = userMarkers.length ? userMarkers.map((m, i) => `<div>${esc(m.item)} <span class="muted">(${m.x}, ${m.y}, ${m.layer})${m.note ? " · " + esc(m.note) : ""}</span> <button class="chip" data-del="${i}">${T("quitar")}</button></div>`).join("") : `<span class="muted">${T("Todavía no has añadido marcadores. Pulsa “+ Añadir” y toca el mapa.")}</span>`; $("#userSheet").hidden = false; }
  $("#userList").onclick = e => { const b = e.target.closest("[data-del]"); if (!b) return; userMarkers.splice(+b.dataset.del, 1); saveUser(); openUser(); render(); };
  $("#userClose").onclick = () => { $("#userSheet").hidden = true; };
  $("#exportBtn").onclick = async () => { const txt = JSON.stringify(userMarkers, null, 1); try { await navigator.clipboard.writeText(txt); $("#exportMsg").textContent = T("Copiado. Pégalo en data/user_markers.json del repo (o en un issue)."); } catch (e) { $("#exportMsg").textContent = txt; } };
  $("#importFile").onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const arr = JSON.parse(await f.text()); if (Array.isArray(arr)) { userMarkers = userMarkers.concat(arr.filter(m => typeof m.x === "number" && typeof m.y === "number")); saveUser(); openUser(); render(); } } catch (err) { $("#exportMsg").textContent = T("JSON no válido."); } };

  $("#stateSel").value = state; $("#stateSel").onchange = e => { state = e.target.value; render(); };
  for (const b of document.querySelectorAll(".chip[data-l]")) b.setAttribute("aria-pressed", !!vis[b.dataset.l]);
  if (vis.place) $("#placeTypes").hidden = false;
  if (q) $("#q").value = q;
  $("#legend").innerHTML = [["grace todo", "grace", "gracia pendiente"], ["grace", "grace", "visitada"], ["boss todo", "boss", "jefe pendiente"], ["boss", "boss", "vencido"], ["miss", "weapon", "objetos que te faltan"], ["place seen", "cave", "lugar visitado"], ["place todo", "cave", "lugar pendiente"], ["place", "cave", "lugar sin datos"], ["user", "user", "añadido"]].map(([c, k, t0]) => [c, k, T(t0)]).map(([c, k, t]) => `<span><span class="pin ${c}" style="display:inline-flex;width:16px;height:16px;vertical-align:middle;margin-right:5px">${glyph(k, 10)}</span>${t}</span>`).join("");
  render();
  syncMarks();
  // #focus=<name>: centre on a place (from the report or the progress lists); bosses and graces resolve to their place
  (function focus() {
    const h = new URLSearchParams(location.hash.slice(1)); const name = h.get("focus"); if (!name) return;
    let p = findPlace(name), label = name, kind = T("Lugar");
    if (!p) { const b = F.bosses.find(x => x.name.toLowerCase() === name.toLowerCase()); if (b) { p = findPlace(b.region) || findPlace(b.name); kind = T("Jefe"); label = b.name + (p ? " · " + p.name : ""); } }
    if (!p) { const g = F.graces.find(x => x.name.toLowerCase() === name.toLowerCase()); if (g) { p = findPlace(g.name) || findPlace(g.region); kind = T("Gracia"); label = g.name; } }
    if (!p) { L.popup().setLatLng([H / 2, W / 2]).setContent(`<div class="popup"><h4>${esc(name)}</h4><div class="m">${T("No tengo coordenadas de este sitio todavía.")}</div></div>`).openOn(map); return; }
    const lay = layerOf(p); if ($("#layerSel").value !== lay) { $("#layerSel").value = lay; setBg(lay); render(); }
    map.setView(at(p), 0, { animate: false });
    L.popup({ offset: [0, -8] }).setLatLng(at(p)).setContent(`<div class="popup"><h4>${wl(p.article || p.name, esc(label))}</h4><div class="m">${kind} · ${esc(KIND_ES[GROUP_KIND[p.group]] || p.group || "")}</div></div>`).openOn(map);
  })();
  if (CUR && !CUR.progress) { L.popup().setLatLng([H / 2, W / 2]).setContent(`<div class="popup"><h4>${T("Falta el progreso")}</h4><div class="m">${T('Esta copia de la partida se guardó con una versión anterior. Vuelve a abrir tu .sl2 en la <a href="./">ficha</a> para ver gracias y jefes visitados.')}</div></div>`).openOn(map); }
  if (!CUR) { L.popup().setLatLng([H / 2, W / 2]).setContent(`<div class="popup"><h4>${T("Sin partida cargada")}</h4><div class="m">${T('Abre tu .sl2 en la <a href="./">ficha</a> y vuelve: verás gracias, jefes y objetos pendientes.')}</div></div>`).openOn(map); }
})();
</script>
</body>
</html>
