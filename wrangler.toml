# Cloudflare Worker con assets estáticos (deploy: `npx wrangler deploy`, también desde Workers Builds al hacer push).
# Los bindings de aquí son la fuente de verdad: lo que se cambie en el panel se sobrescribe en el siguiente deploy.
name = "tarnishedviewer"
main = "worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "."
binding = "ASSETS"
html_handling = "none"          # rutas exactas (map.html, icons.html); "/" sigue sirviendo index.html
# ficheros que no se publican como assets: ver .assetsignore

[[d1_databases]]
binding = "DB"
database_name = "tarnished-ledger"
database_id = "1e0ef758-2fc0-4a75-af7e-38ee24d69475"

[vars]
# SteamID64 de los moderadores, separados por comas
ADMIN_STEAMIDS = "REPLACE_WITH_YOUR_STEAMID64"
# Consejero: "closed" = beta cerrada (solo cuentas aprobadas a mano por un moderador); "owners" = además toda cuenta con Elden Ring en Steam
ADVISOR_MODE = "closed"

# Correo saliente del Worker (avisos de solicitudes de activación del consejero). Destino: secreto ADMIN_EMAIL, que debe ser
# una dirección verificada en Email Routing del dominio. Sin binding o sin secreto no se envía nada (functions/_mail.js).
[[send_email]]
name = "EMAIL"
